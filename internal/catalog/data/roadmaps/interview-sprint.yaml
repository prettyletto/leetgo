    title: "Foundations"
    description: "Refresh the patterns that appear everywhere."
  - id: core-patterns
    title: "Core Patterns"
    description: "Practice the highest-frequency array, pointer, window, stack, and search Problems."
  - id: trees-graphs
    title: "Trees & Graphs"
    description: "Cover traversal and connectivity patterns."
  - id: dynamic-programming
    title: "Dynamic Programming"
    description: "Build enough recurrence fluency for common interviews."

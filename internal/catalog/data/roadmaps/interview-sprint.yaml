id: interview-sprint
title: "Interview Sprint"
description: "A tighter Roadmap for users already practicing who need high-yield interview coverage."
tagline: "Fast-track your interview prep with high-yield problems."
audience: "Users with some LeetCode experience preparing for upcoming interviews."
promise: "You will cover the most frequently asked patterns in a focused timeline."
recommended: false
estimated_hours: 40
difficulty_mix:
  easy: 25
  medium: 60
  hard: 15
highlights:
  - "High-frequency interview patterns"
  - "Condensed timeline"
stages:

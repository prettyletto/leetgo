id: from-zero-to-hero
title: "From Zero To Hero"
description: "A default Roadmap that starts with fundamentals and builds toward interview-ready problem solving."
tagline: "Build LeetCode fundamentals from zero into interview readiness."
audience: "New or returning users who want a guided foundation-first path."
promise: "You will learn the core patterns in the order they unlock each other."
recommended: true
estimated_hours: 80
difficulty_mix:
  easy: 35
  medium: 50
  hard: 15
highlights:
  - "Foundation-first unlock path"
  - "Broad interview coverage"
  - "Gentle difficulty ramp"
stages:
  - id: arrays-hashing
    title: "Arrays & Hashing"
    description: "Build the base patterns for lookup tables, counting, and array traversal."
  - id: two-pointers
    title: "Two Pointers"
    description: "Learn converging pointer and sorted-input patterns."
  - id: sliding-window
    title: "Sliding Window"
    description: "Practice fixed and variable-size window reasoning."
  - id: stack
    title: "Stack"
    description: "Use stack state to model nesting, monotonic order, and deferred work."
  - id: binary-search
    title: "Binary Search"
    description: "Search ordered spaces and monotonic answer functions."
  - id: linked-list
    title: "Linked List"
    description: "Handle pointer manipulation and list invariants."
  - id: trees
    title: "Trees"
    description: "Traverse and reason about hierarchical structures."
  - id: heap-priority-queue
    title: "Heap & Priority Queue"
    description: "Maintain ordered frontiers and top-k selections."
  - id: backtracking
    title: "Backtracking"
    description: "Explore combinatorial search spaces with pruning."
  - id: graphs
    title: "Graphs"
    description: "Model relationships with traversal, components, and shortest paths."
  - id: dynamic-programming
    title: "Dynamic Programming"
    description: "Convert recurrence structure into reliable state transitions."
  - id: intervals
    title: "Intervals"
    description: "Sort and merge ranges while preserving boundary correctness."
  - id: greedy
    title: "Greedy"
    description: "Choose local moves that preserve global optimality."
  - id: math-geometry
    title: "Math & Geometry"
    description: "Use numeric and spatial reasoning for specialized Problems."
  - id: bit-manipulation
    title: "Bit Manipulation"
    description: "Operate directly on binary representations and masks."

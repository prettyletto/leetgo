id: from-zero-to-hero
title: "From Zero To Hero"
description: "A default Roadmap that starts with fundamentals and builds toward interview-ready problem solving."
tagline: "Build LeetCode fundamentals from zero into interview readiness."
audience: "New or returning users who want a guided foundation-first path."
promise: "You will learn the core patterns in the order they unlock each other."
recommended: true
estimated_hours: 80
roadmap_time_estimate: "4-8 weeks at 3-5 Problems/week"
difficulty_mix:
  easy: 35
  medium: 50
  hard: 15
highlights:
  - "Foundation-first unlock path"
  - "Broad interview coverage"
  - "Gentle difficulty ramp"
next_roadmaps:
  - "interview-sprint"
  - "hard-mode"
stages:
  - id: arrays-hashing
    title: "Arrays & Hashing"
    description: "Build the base patterns for lookup tables, counting, and array traversal."
  - id: two-pointers
    title: "Two Pointers"
    description: "Learn converging pointer and sorted-input patterns."
  - id: sliding-window
    title: "Sliding Window"
    description: "Practice fixed and variable-size window reasoning."
  - id: stack
    title: "Stack"
    description: "Use stack state to model nesting, monotonic order, and deferred work."
  - id: binary-search
    title: "Binary Search"
    description: "Search ordered spaces and monotonic answer functions."
  - id: linked-list
    title: "Linked List"
    description: "Handle pointer manipulation and list invariants."
  - id: trees
    title: "Trees"
    description: "Traverse and reason about hierarchical structures."
  - id: heap-priority-queue
    title: "Heap & Priority Queue"
    description: "Maintain ordered frontiers and top-k selections."
  - id: backtracking
    title: "Backtracking"
    description: "Explore combinatorial search spaces with pruning."
  - id: graphs
    title: "Graphs"
    description: "Model relationships with traversal, components, and shortest paths."
  - id: dynamic-programming
    title: "Dynamic Programming"
    description: "Convert recurrence structure into reliable state transitions."
  - id: intervals
    title: "Intervals"
    description: "Sort and merge ranges while preserving boundary correctness."
  - id: greedy
    title: "Greedy"
    description: "Choose local moves that preserve global optimality."
  - id: math-geometry
    title: "Math & Geometry"
    description: "Use numeric and spatial reasoning for specialized Problems."
  - id: bit-manipulation
    title: "Bit Manipulation"
    description: "Operate directly on binary representations and masks."
problems:
  # ========== Arrays & Hashing ==========
  - id: 217
    title: "Contains Duplicate"
    slug: "contains-duplicate"
    difficulty: easy
    category: "arrays-hashing"
    prerequisites: []
    practice_focus: "Set membership and duplicate detection"
    problem_time_estimate: "10-15 minutes"
    summary: "Check whether any value appears at least twice in an integer array."
    why_now: "Introduces hash-set lookup as the simplest building block for all future hash-table Problems."
    unlock_impact: "Prepares the set-membership pattern needed for Valid Sudoku, Top K Frequent, and Longest Consecutive Sequence."
    hints:
      - "What data structure gives O(1) membership checks?"
      - "Can you check every element against a growing set in one pass?"

  - id: 242
    title: "Valid Anagram"
    slug: "valid-anagram"
    difficulty: easy
    category: "arrays-hashing"
    prerequisites: []
    practice_focus: "Character frequency counting"
    problem_time_estimate: "10-15 minutes"
    summary: "Determine if one string is an anagram of another by comparing character counts."
    why_now: "Introduces frequency counting, which generalizes from characters to arbitrary keys in Group Anagrams."
    unlock_impact: "Unlocks Group Anagrams by establishing the frequency-counting pattern."
    hints:
      - "Can you count occurrences of each character in both strings?"
      - "For follow-up with Unicode, what data structure replaces a fixed array?"

  - id: 1
    title: "Two Sum"
    slug: "two-sum"
    difficulty: easy
    category: "arrays-hashing"
    prerequisites: []
    practice_focus: "Hash-table complement lookup"
    problem_time_estimate: "15-20 minutes"
    summary: "Find two indices whose values sum to a target using a single-pass hash map."
    why_now: "The complement pattern is the most common hash-table interview technique and a fundamental building block."
    unlock_impact: "Unlocks Two Sum II, 3Sum, Product of Array Except Self, 4Sum II, and many pointer-based follow-ups."
    hints:
      - "Given a number x at index i, what value would you look up to reach the target?"
      - "Store each visited number in a map so you can check complements in one pass."

  - id: 49
    title: "Group Anagrams"
    slug: "group-anagrams"
    difficulty: medium
    category: "arrays-hashing"
    prerequisites: [242]
    practice_focus: "Encoding strings into canonical keys"
    problem_time_estimate: "20-30 minutes"
    summary: "Group strings that are anagrams of each other by mapping each to a canonical key."
    why_now: "Builds on Valid Anagram: now you encode each string into a key so anagrams share the same bucket."
    unlock_impact: "Strengthens the key-derivation pattern needed for advanced hashing and encoding Problems."
    hints:
      - "What property do all anagrams of the same word share?"
      - "Can you sort each string to produce a shared key? Is there a faster encoding?"

  - id: 347
    title: "Top K Frequent Elements"
    slug: "top-k-frequent-elements"
    difficulty: medium
    category: "arrays-hashing"
    prerequisites: [217]
    practice_focus: "Frequency counting combined with heap/bucket selection"
    problem_time_estimate: "20-30 minutes"
    summary: "Return the K most frequent elements using frequency counts and a heap or bucket sort."
    why_now: "Combines the set-membership from Contains Duplicate with counting and introduces heap selection."
    unlock_impact: "Prepares the frequency-plus-ordering pattern used in heap and top-k Problems ahead."
    hints:
      - "Count frequencies first, then how do you select the top K?"
      - "Consider using bucket sort if the value range is bounded."

  - id: 238
    title: "Product of Array Except Self"
    slug: "product-of-array-except-self"
    difficulty: medium
    category: "arrays-hashing"
    prerequisites: [1]
    practice_focus: "Prefix and suffix product arrays"
    problem_time_estimate: "20-25 minutes"
    summary: "Compute an array where each element is the product of all other elements without division."
    why_now: "Shifts from hash-table complements to structural prefix products, which appear in many prefix-sum Problems."
    unlock_impact: "Establishes the prefix-array pattern used in subarray-sum, product, and cumulative-count Problems."
    hints:
      - "What if you compute left-side products and right-side products separately?"
      - "Can you reuse the output array to avoid extra space?"

  - id: 36
    title: "Valid Sudoku"
    slug: "valid-sudoku"
    difficulty: medium
    category: "arrays-hashing"
    prerequisites: [217]
    practice_focus: "Grid indexing and duplicate detection with tuple keys"
    problem_time_estimate: "20-25 minutes"
    summary: "Validate that a partially filled 9x9 Sudoku board follows the row, column, and sub-box rules."
    why_now: "Applies the set-membership pattern to a 2D grid, combining multiple indexing schemes."
    unlock_impact: "Prepares the multidimensional hashing and grid-tracking patterns for matrix Problems ahead."
    hints:
      - "Can you encode each (value, row), (value, column), and (value, box) tuple as a set key?"
      - "What's the formula for mapping a cell to its 3x3 sub-box index?"

  - id: 128
    title: "Longest Consecutive Sequence"
    slug: "longest-consecutive-sequence"
    difficulty: medium
    category: "arrays-hashing"
    prerequisites: [217]
    practice_focus: "Sequence building with O(n) set lookups"
    problem_time_estimate: "20-30 minutes"
    summary: "Find the length of the longest consecutive elements sequence in an unsorted array in O(n) time."
    why_now: "Deepens the set-membership pattern by showing how set lookups can replace sorting for sequence detection."
    unlock_impact: "Demonstrates how to replace sorting with clever set use, a recurring optimization in greedy and interval Problems."
    hints:
      - "If you put everything in a set, how do you identify a sequence start?"
      - "Only count from numbers that have no left neighbor in the set."

  - id: 271
    title: "Encode and Decode Strings"
    slug: "encode-and-decode-strings"
    difficulty: medium
    category: "arrays-hashing"
    prerequisites: []
    practice_focus: "Serialization with length-prefix encoding"
    problem_time_estimate: "15-20 minutes"
    summary: "Design a reversible encoding that converts a list of strings to a single string and back."
    why_now: "Introduces length-prefix encoding, a practical pattern that appears in network protocols and serialization."
    unlock_impact: "Prepares encoding/decoding patterns that appear in tree serialization and bit-level Problems."
    hints:
      - "How can you embed the length of each string so the decoder knows where one ends?"
      - "Consider using the pattern '3:abc' read as '3 characters followed by abc'."

  - id: 454
    title: "4Sum II"
    slug: "4sum-ii"
    difficulty: medium
    category: "arrays-hashing"
    prerequisites: [1]
    practice_focus: "Sum decomposition with hash-table counting"
    problem_time_estimate: "20-25 minutes"
    summary: "Count tuples from four arrays that sum to zero by decomposing into two-sum subproblems."
    why_now: "Extends the Two Sum complement pattern to four arrays, reinforcing decomposition as a problem-solving tool."
    unlock_impact: "Strengthens divide-and-conquer thinking that applies to multi-pointer and k-sum variations."
    hints:
      - "Can you split the four arrays into two groups and solve a two-sum-like problem?"
      - "Count all sums of A[i] + B[j] in a map, then check complements from C[k] + D[l]."

  # ========== Two Pointers ==========
  - id: 125
    title: "Valid Palindrome"
    slug: "valid-palindrome"
    difficulty: easy
    category: "two-pointers"
    prerequisites: []
    practice_focus: "Two-pointer character comparison with filtering"
    problem_time_estimate: "10-15 minutes"
    summary: "Check if a string reads the same forward and backward after removing non-alphanumeric characters."
    why_now: "Introduces the converging two-pointer pattern on a single sequence, the simplest pointer technique."
    unlock_impact: "Prepares the inward-convergence pattern used in Container With Most Water and Trapping Rain Water."
    hints:
      - "Can you skip non-alphanumeric characters while moving two pointers inward?"
      - "Use isalnum and tolower to filter and normalize as you go."

  - id: 167
    title: "Two Sum II"
    slug: "two-sum-ii-input-array-is-sorted"
    difficulty: medium
    category: "two-pointers"
    prerequisites: [1]
    practice_focus: "Opposing pointers on sorted input"
    problem_time_estimate: "15-20 minutes"
    summary: "Find two numbers in a sorted array that sum to a target using left and right pointers."
    why_now: "Extends Two Sum into sorted-array territory, replacing the hash map with the opposing-pointer trick."
    unlock_impact: "Unlocks 3Sum by establishing the sorted-array two-sum subproblem."
    hints:
      - "If the current sum is too small, which pointer should move inward?"
      - "Initialize left at 0 and right at n-1; the sorted property guarantees you only need one pass."

  - id: 15
    title: "3Sum"
    slug: "3sum"
    difficulty: medium
    category: "two-pointers"
    prerequisites: [1, 167]
    practice_focus: "Three-pointer decomposition with deduplication"
    problem_time_estimate: "25-35 minutes"
    summary: "Find all unique triplets that sum to zero by fixing one element and running a two-pointer search on the remainder."
    why_now: "Combines Two Sum's sum-seeking with Two Sum II's sorted-pointer pattern to handle a third element."
    unlock_impact: "Establishes the fix-one-run-two-pointers pattern used in 4Sum, 3Sum Closest, and general k-sum Problems."
    hints:
      - "Sort first, then for each index i, run Two Sum II on the right subarray."
      - "Skip duplicate values for both the fixed element and the two-pointer pairs."

  - id: 11
    title: "Container With Most Water"
    slug: "container-with-most-water"
    difficulty: medium
    category: "two-pointers"
    prerequisites: [125]
    practice_focus: "Greedy area maximization with two pointers"
    problem_time_estimate: "15-20 minutes"
    summary: "Find the maximum water container area formed by vertical lines using two converging pointers."
    why_now: "Applies the Valid Palindrome two-pointer convergence pattern to a greedy area-optimization problem."
    unlock_impact: "Sets up the left/right max-tracking intuition needed for Trapping Rain Water."
    hints:
      - "Area is min(height[left], height[right]) * (right - left). How do you decide which pointer to move?"
      - "Always move the pointer at the shorter line, because moving the taller one can never increase the area."

  - id: 42
    title: "Trapping Rain Water"
    slug: "trapping-rain-water"
    difficulty: hard
    category: "two-pointers"
    prerequisites: [11]
    practice_focus: "Water trapping with max-boundary tracking"
    problem_time_estimate: "30-45 minutes"
    summary: "Compute total trapped water by tracking the maximum heights seen from the left and right at each position."
    why_now: "Extends Container With Most Water from single-area optimization to cumulative water trapping using boundary tracking."
    unlock_impact: "Completes the two-pointer track and prepares the monotonic-stack variant useful in histogram and elevation Problems."
    hints:
      - "At each index, trapped water = min(maxLeft, maxRight) - height[i] (if positive)."
      - "Use two pointers that converge while maintaining leftMax and rightMax; you don't need a full prefix array."

  # ========== Sliding Window ==========
  - id: 121
    title: "Best Time to Buy and Sell Stock"
    slug: "best-time-to-buy-and-sell-stock"
    difficulty: easy
    category: "sliding-window"
    prerequisites: []
    practice_focus: "Single-pass min-tracking with max-profit window"
    problem_time_estimate: "10-15 minutes"
    summary: "Find the maximum profit from buying and selling a stock once by tracking the running minimum price."
    why_now: "Introduces the running-min / sliding-decision pattern that is the foundation for variable-size windows."
    unlock_impact: "Unlocks Longest Substring Without Repeating Characters and the stock-series extensions (Cooldown, II, III)."
    hints:
      - "Track the lowest price seen so far while scanning forward."
      - "At each day, compute profit = price[i] - minSoFar and keep the max."

  - id: 3
    title: "Longest Substring Without Repeating Characters"
    slug: "longest-substring-without-repeating-characters"
    difficulty: medium
    category: "sliding-window"
    prerequisites: [121]
    practice_focus: "Variable-size window with set-based validity"
    problem_time_estimate: "15-20 minutes"
    summary: "Find the longest substring without repeating characters by expanding and contracting a window with a set."
    why_now: "Builds on stock profit's single-pointer tracking by adding a second pointer that contracts on invalid state."
    unlock_impact: "Unlocks all remaining sliding-window Problems (Replacement, Permutation, Minimum Window) by teaching window contraction."
    hints:
      - "Use a set to track characters in the current window; when you see a duplicate, shrink the left side."
      - "The window is valid when set size equals window length; maximize window length."

  - id: 424
    title: "Longest Repeating Character Replacement"
    slug: "longest-repeating-character-replacement"
    difficulty: medium
    category: "sliding-window"
    prerequisites: [3]
    practice_focus: "Window validity via max-frequency check"
    problem_time_estimate: "20-30 minutes"
    summary: "Find the longest substring where at most k replacements make all characters equal, using a frequency-count window."
    why_now: "Extends Longest Substring's variable window by replacing set-based validity with a max-frequency budget condition."
    unlock_impact: "Prepares the frequency-budget window condition used in Minimum Window Substring."
    hints:
      - "Track the max frequency of any character in the window; the window is valid if length - maxFreq <= k."
      - "You never need to shrink maxFreq downwards, because a smaller maxFreq can't produce a longer window."

  - id: 567
    title: "Permutation in String"
    slug: "permutation-in-string"
    difficulty: medium
    category: "sliding-window"
    prerequisites: [3]
    practice_focus: "Fixed-size window with frequency matching"
    problem_time_estimate: "15-20 minutes"
    summary: "Check if s2 contains a permutation of s1 by sliding a fixed-size window and comparing character counts."
    why_now: "Shifts from variable-length to fixed-length window pattern, a distinct and common subcategory of sliding window."
    unlock_impact: "Completes the fixed-size window pattern needed alongside variable windows in Minimum Window Substring."
    hints:
      - "The window size is exactly len(s1); what frequency array must it match?"
      - "Use a sliding count array that updates in O(1) when the window moves right."

  - id: 76
    title: "Minimum Window Substring"
    slug: "minimum-window-substring"
    difficulty: hard
    category: "sliding-window"
    prerequisites: [424, 567]
    practice_focus: "Contract-while-valid variable-size window"
    problem_time_estimate: "30-45 minutes"
    summary: "Find the minimum window in s that contains all characters of t, contracting to minimize length while maintaining validity."
    why_now: "Combines frequency-budget validity (Replacement) with the contract-to-optimize pattern from earlier windows."
    unlock_impact: "Culminates the sliding-window track and prepares multi-constraint window Problems in interview hard rounds."
    hints:
      - "Maintain two frequency maps (window and target); track how many characters have met their required count."
      - "Expand right until valid, then shrink left while valid to minimize window length."

  - id: 239
    title: "Sliding Window Maximum"
    slug: "sliding-window-maximum"
    difficulty: hard
    category: "sliding-window"
    prerequisites: [3]
    practice_focus: "Monotonic deque for fixed-window max"
    problem_time_estimate: "25-35 minutes"
    summary: "Find the maximum in each sliding window of size k using a monotonic decreasing deque."
    why_now: "Introduces the monotonic deque pattern, which combines sliding window movement with ordered queue maintenance."
    unlock_impact: "Bridges sliding windows with monotonic data structures, key for stack/deque hybrid Problems ahead."
    hints:
      - "Use a deque that stores indices in decreasing order of values; the front is always the window max."
      - "Remove indices from the back that are smaller than the incoming element, and from the front that fall outside the window."

  # ========== Stack ==========
  - id: 20
    title: "Valid Parentheses"
    slug: "valid-parentheses"
    difficulty: easy
    category: "stack"
    prerequisites: []
    practice_focus: "Bracket matching with LIFO stack"
    problem_time_estimate: "10-15 minutes"
    summary: "Determine if a string of parentheses is valid by pushing opening brackets onto a stack and popping on closing matches."
    why_now: "Introduces stack as the go-to tool for deferred matching and nested-structure validation."
    unlock_impact: "Unlocks all remaining stack Problems and the balanced-parenthesis pattern used in backtracking and parsing."
    hints:
      - "Push opening brackets; on a closing bracket, the top of the stack must be its matching opener."
      - "Use a map from closing to opening brackets for clean lookups."

  - id: 155
    title: "Min Stack"
    slug: "min-stack"
    difficulty: medium
    category: "stack"
    prerequisites: [20]
    practice_focus: "Dual-stack design for O(1) min query"
    problem_time_estimate: "15-20 minutes"
    summary: "Design a stack that supports push, pop, top, and getMin in O(1) time."
    why_now: "Extends the basic stack from Valid Parentheses with a secondary structure for efficient min-tracking."
    unlock_impact: "Introduces the auxiliary-data-structure design pattern that reappears in LRU Cache and Median Stream."
    hints:
      - "Keep a second stack that stores the minimum value seen so far at each level."
      - "When pushing, push min(val, currentMin) onto the min-stack; pop both stacks together."

  - id: 150
    title: "Evaluate Reverse Polish Notation"
    slug: "evaluate-reverse-polish-notation"
    difficulty: medium
    category: "stack"
    prerequisites: [20]
    practice_focus: "Postfix expression evaluation with stack"
    problem_time_estimate: "15-20 minutes"
    summary: "Evaluate an arithmetic expression in Reverse Polish Notation by pushing operands and applying operators to the top two."
    why_now: "Applies stack push/pop discipline to expression evaluation, a classic use of LIFO for deferred operations."
    unlock_impact: "Forms the basis for expression evaluation patterns used in calculator and compiler Problems."
    hints:
      - "Push numbers onto the stack; when you see an operator, pop two, compute, and push the result."
      - "Be careful about operand order: the second pop is the left operand for non-commutative operators."

  - id: 22
    title: "Generate Parentheses"
    slug: "generate-parentheses"
    difficulty: medium
    category: "stack"
    prerequisites: [20]
    practice_focus: "Backtracking with balanced-parens constraint"
    problem_time_estimate: "15-20 minutes"
    summary: "Generate all valid combinations of n pairs of parentheses using recursive backtracking with open/close counts."
    why_now: "Combines Valid Parentheses stack logic with recursive generation, bridging stack and backtracking patterns."
    unlock_impact: "Links stack validation to backtracking generation, a dual perspective that strengthens both categories."
    hints:
      - "You can add an opening bracket if open < n; add a closing bracket if close < open."
      - "Use recursion that builds strings incrementally, backtracking when both counts reach n."

  - id: 739
    title: "Daily Temperatures"
    slug: "daily-temperatures"
    difficulty: medium
    category: "stack"
    prerequisites: [20]
    practice_focus: "Monotonic decreasing stack for next-greater"
    problem_time_estimate: "15-20 minutes"
    summary: "For each day, find how many days until a warmer temperature using a monotonic decreasing stack."
    why_now: "Introduces monotonic stack, a powerful extension of basic LIFO for next-greater/next-smaller pattern Problems."
    unlock_impact: "Unlocks Car Fleet, Largest Rectangle, and the entire next-greater-element family of Problems."
    hints:
      - "Iterate through temperatures; while the stack top is colder than the current day, pop and record the difference."
      - "The stack stores indices, and you compare temperatures[index]."

  - id: 853
    title: "Car Fleet"
    slug: "car-fleet"
    difficulty: medium
    category: "stack"
    prerequisites: [739]
    practice_focus: "Monotonic stack for time-to-destination grouping"
    problem_time_estimate: "20-30 minutes"
    summary: "Determine how many car fleets arrive at the target by computing arrival times and using a monotonic stack."
    why_now: "Applies the monotonic stack from Daily Temperatures to a physics-based grouping problem with arrival-time ordering."
    unlock_impact: "Extends monotonic stack reasoning to non-array-element domains, showing the pattern's generality."
    hints:
      - "Sort by starting position, then compute each car's time to target: (target - position) / speed."
      - "A car forms a fleet with the car ahead if its arrival time is slower; use a stack to merge fleets from back to front."

  - id: 84
    title: "Largest Rectangle in Histogram"
    slug: "largest-rectangle-in-histogram"
    difficulty: hard
    category: "stack"
    prerequisites: [739]
    practice_focus: "Monotonic increasing stack for rectangle area"
    problem_time_estimate: "30-45 minutes"
    summary: "Find the largest rectangular area in a histogram using a monotonic increasing stack to track bar boundaries."
    why_now: "Deepens monotonic stack technique from next-greater to area computation with boundary-tracking on both sides."
    unlock_impact: "Culminates the stack track and directly unlocks the maximal-rectangle variant in binary matrix Problems."
    hints:
      - "Use an increasing stack of indices; pop when the current bar is shorter, computing area with the popped height."
      - "Width is determined by current index minus stack-top-after-pop minus one."

  # ========== Binary Search ==========
  - id: 704
    title: "Binary Search"
    slug: "binary-search"
    difficulty: easy
    category: "binary-search"
    prerequisites: []
    practice_focus: "Classic sorted-array binary search"
    problem_time_estimate: "10-15 minutes"
    summary: "Find the index of a target value in a sorted array using iterative binary search."
    why_now: "Introduces the fundamental mid-point narrowing pattern that all binary search Problems extend."
    unlock_impact: "Unlocks every remaining binary search Problem: 2D search, rotating arrays, and answer-space search."
    hints:
      - "Compute mid = left + (right - left) / 2 to avoid overflow."
      - "If nums[mid] < target, search right; else search left."

  - id: 74
    title: "Search a 2D Matrix"
    slug: "search-a-2d-matrix"
    difficulty: medium
    category: "binary-search"
    prerequisites: [704]
    practice_focus: "1D-to-2D index mapping for binary search"
    problem_time_estimate: "15-20 minutes"
    summary: "Search a sorted 2D matrix as a flattened sorted array using index arithmetic."
    why_now: "Extends basic binary search by applying it to a 2D structure via row/column index mapping."
    unlock_impact: "Reinforces the treat-2D-as-1D mapping pattern used in matrix and search-space Problems."
    hints:
      - "Treat the matrix as a sorted array of size rows * cols; map index i to matrix[i / cols][i % cols]."
      - "Binary search over the virtual 1D range from 0 to rows * cols - 1."

  - id: 875
    title: "Koko Eating Bananas"
    slug: "koko-eating-bananas"
    difficulty: medium
    category: "binary-search"
    prerequisites: [704]
    practice_focus: "Binary search on answer space"
    problem_time_estimate: "20-30 minutes"
    summary: "Find the minimum eating speed K such that all bananas are eaten within H hours using binary search on K."
    why_now: "Introduces binary search over the answer space (not the input), a meta-pattern for optimization Problems."
    unlock_impact: "Unlocks answer-space binary search used in capacity-shipment, split-array, and many minimax Problems."
    hints:
      - "The answer K is between 1 and max(piles). Can you binary search this range?"
      - "For a candidate speed K, compute total hours = sum(ceil(p / K) for p in piles) and check if <= H."

  - id: 153
    title: "Find Minimum in Rotated Sorted Array"
    slug: "find-minimum-in-rotated-sorted-array"
    difficulty: medium
    category: "binary-search"
    prerequisites: [704]
    practice_focus: "Binary search with rotation-discontinuity detection"
    problem_time_estimate: "15-20 minutes"
    summary: "Find the minimum element in a rotated sorted array using binary search on the inflection point."
    why_now: "Extends binary search to handle a single discontinuity (rotation), teaching pivot-finding logic."
    unlock_impact: "Unlocks Search in Rotated Sorted Array by establishing the pivot-relative comparison pattern."
    hints:
      - "Compare nums[mid] with nums[right]; if nums[mid] > nums[right], the minimum is on the right."
      - "When the while loop exits, left points to the minimum element."

  - id: 33
    title: "Search in Rotated Sorted Array"
    slug: "search-in-rotated-sorted-array"
    difficulty: medium
    category: "binary-search"
